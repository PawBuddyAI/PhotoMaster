[package]
name = "ai-photo-master"
# 发布版本以 package.json 为准（tauri.conf.json 引用它），这里不随发布更新
version = "0.1.0"
description = "AI 修图 Windows 桌面版"
authors = ["k99k5"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "ai_photo_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# PawBuddy 账户：在系统浏览器打开网站授权，授权后经 ai-photo-master:// 深链回到已运行的窗口
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# tauri.conf.json 有 plugins 配置时，generate_context! 展开的代码用 serde_json 读取它
serde_json = "1"
tauri-plugin-persisted-scope = "2"
