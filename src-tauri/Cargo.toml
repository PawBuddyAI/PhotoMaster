[package]
name = "ai-photo-master"
version = "0.1.0"
description = "AI 修图 Windows 桌面版"
authors = ["k99k5"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "ai_photo_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
